services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend:local
    container_name: frontend
    env_file:
      - ./frontend/.env.local        # loads Cognito/auth vars from your local env file
    environment:
      API_GATEWAY_BASE_URL: http://gateway:8000   # overrides localhost URL ? containers use service name
    ports:
      - "3000:3000"
    depends_on:
      - gateway

  gateway:
    build:
      context: ./services/gateway
      dockerfile: docker/Dockerfile
    image: gateway:local
    container_name: gateway
    environment:
      LOCAL_AUTH_BYPASS: "true"
      PROFILE_SERVICE_URL: http://profile:8080
    ports:
      - "8000:8000"
    depends_on:
      - profile
      - cv-parser

  cv-parser:
    build:
      context: ./services/cv-parser
      dockerfile: docker/Dockerfile
    image: cv-parser:local
    container_name: cv-parser
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      PARSER_QUEUE_URL: http://localstack:4566/000000000000/cv-parser-queue
      PARSER_DLQ_URL: http://localstack:4566/000000000000/cv-parser-dlq
      PROFILE_SERVICE_BASE_URL: http://profile:8080
      CV_BUCKET_NAME: profile-cv-bucket
    ports:
      - "8090:8090"
    depends_on:
      - profile
      - localstack

  profile:
    build:
      context: ./services/profile
      dockerfile: docker/Dockerfile
    image: profile:local
    container_name: profile
    environment:
      DATABASE_URL: postgresql://profile_user:profile_pass@postgres:5432/profile_db
      AWS_ENDPOINT_URL: http://localstack:4566
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - localstack
    command: ["uvicorn", "src.app.main:app", "--host", "0.0.0.0", "--port", "8080"]

  postgres:
    image: postgres:16
    container_name: profile-postgres
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: profile_user
      POSTGRES_PASSWORD: profile_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  localstack:
    image: localstack/localstack:3.5
    container_name: profile-localstack
    environment:
      - SERVICES=s3,sqs
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack/init:/etc/localstack/init/ready.d

volumes:
  pgdata:
  localstack_data:
